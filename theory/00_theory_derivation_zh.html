## 0. 记号与约定

沿用数据面板/attribution 的口径，**全部量都按 spot 归一**（等价于设 $S_0=1$，一切以\"占名义比例\"表示）。

| 符号 | 含义 | 数据来源 |

| $K$ | 行权价；$k=K/S_0$ | `Cap` 列 = $k$ |
| $c=k-1$ | **cap**（净收益空间的上限位置）。OTM: $c>0$；ATM: $c=0$；ITM: $c<0$ | `Cap`−1 |
| $y(c)$ | 该 strike 的**单位覆盖名义**权利金率 $=C_0/S_0$ | `Call Yield` |
| $f\in[0,1]$ | **覆盖比例**（overwrite ratio）= 卖出期权股数 ÷ 持股股数 | rebal report 股数比 |

| $\tau$ | 到期时间（年） | 1M ≈ 1/12 |
| $r_f,\ q$ | 年化连续复利无风险利率、定价用股息率 | TB3MS / 各标的 |

| $\mathbb{P},\ \mathbb{Q}$ | 真实测度、风险中性测度 | — |

**两个旋钮**：整个策略空间就是二维平面 $(f,\ c)$。Income family = $f=1$、$c$ 由 target yield 反解；Exposure family = $c\approx0$、$f$ 固定。它们是同一平面上的两条线，不是两个\"策略\"。

## 1. 单期收益：一般式

### 1.1 从 payoff 推

$t=0$：以 $S_0$ 买入 1 股（名义 $S_0$），在其中 $f$ 比例上卖出行权价 $K$ 的 call，收权利金 $f\,y\,S_0$，现金以 $r_f$ 计息。

$t=T$ 组合价值：

$$V_T=\underbrace{S_T}_{\text{持股}}+\underbrace{D_{0\to T}}_{\text{实际现金股息}}-\underbrace{f\,(S_T-K)^+}_{\text{被行权赔付}}+\underbrace{f\,y\,S_0\,e^{r_f\tau}}_{\text{权利金+利息}}$$

除以 $S_0$ 再减 1，注意 $(S_T-K)/S_0=R-k=r-c$：

$$\boxed{\;R_{cc}=r+d_T+f\,y\,e^{r_f\tau}-f\,(r-c)^+\;}\tag{1}$$

这里刻意区分 $q$ 与 $d_T$：$q$ 是期权定价使用的年化连续股息率，$d_T$ 才是进入 payoff 的单期实际简单股息回报。toy 计算若没有实际股息数据，可用 $e^{q\tau}-1$ 近似 $d_T$；这不是 payoff 恒等式。

### 1.2 等价的三种写法（各有用处）

$$R_{cc}\;=\;\underbrace{r+d_T}_{\text{标的总收益}}\;+\;f\big[\,y\,e^{r_f\tau}-(r-c)^+\,\big]\tag{1a}$$

$$R_{cc}\;=\;\underbrace{(1-f)\,r}_{\text{裸股部分}}\;+\;\underbrace{f\big[\min(r,\,c)+y\,e^{r_f\tau}\big]}_{\text{被覆盖部分}}\;+\;d_T\tag{1b}$$

$$1+R_{cc}\;=\;\underbrace{(1-f)\,R}_{\text{裸股}}\;+\;\underbrace{f\,\min(R,\,k)}_{\text{封顶股}}\;+\;f\,y\,e^{r_f\tau}+d_T\tag{1c}$$

- (1a) 用于**归因**：标的收益 + 期权腿贡献。
- (1b) 是你问题里那个\"$f\cdot(\text{stock+premium})+(1-f)\cdot\text{stock}$\"的严格版本 —— 注意被覆盖那部分不是 `stock+premium` 而是 `min(r,c)+premium`，只有在 $r\le c$ 时才等于 `stock+premium`。
- (1c) 用于**定价与测度变换**：$\min(R,k)$ 是一个\"封顶资产\"。

**与 index-provider attribution 对账**：令 $d_T=r_f=0$，(1) 化为
$$\texttt{Index Return}=r-f\cdot\max\big(r-(\texttt{Cap}-1),0\big)+f\cdot\texttt{Call Yield}$$
即笔记 §10 逐月验证（220 个月误差中位数 0.00000）的那条恒等式。**（脚本校验：max diff = 2.8e-17）**

### 1.3 关键恒等式：备兑 = 现金担保卖出看跌

$$\min(S_T,K)=K-(K-S_T)^+$$

所以**满仓备兑（$f=1$）在到期日的 payoff 与\"持有 $K$ 面额的债券 + 卖出行权价 $K$ 的 put\"完全相同**（put-call parity 的到期形式）。推论：

> 整个 $(f,c)$ 平面就是一张**\"卖多大、卖多远的 put\"的菜单**。
> - ITM 备兑（$c<0$）= 大量现金 + 卖一张深度虚值 put → 类现金资产；
> - ATM 备兑（$c=0$）= 卖平值 put → 约 50% delta；
> - 深度 OTM 备兑（$c\gg0$）= 几乎裸股 + 卖一张极小的 put。
>
> 这解释了为什么\"备兑写权\"从来不是一个独立的风险来源：它只是 **equity beta + short put（= short vol + short skew）** 的重新包装。也直接对上 AQR 的三重分解。

## 2. 六种情形全枚举

由 (1b)，令 $\tilde y\equiv y\,e^{r_f\tau}$，并在情形表中暂略 $d_T$：

### 2.1 满仓覆盖 $f=1$：$R_{cc}=\min(r,c)+\tilde y$

| strike 选择 | 未被行权（$r\le c$） | 被行权（$r>c$） | 最大收益（cap） | 下行缓冲 | 结构含义 |
|---|---|---|---|---|---|
| **OTM** $c>0$ | $r+\tilde y$ | $c+\tilde y$ | $c+\tilde y>0$ | $\tilde y$ | 保留 $c$ 以内涨幅 + 权利金；这就是\"$k>s$ 时 return = 股票收益 + premium，被打中后 = (K−S)/S + premium\" |
| **ATM** $c=0$ | $r+\tilde y$（$r<0$） | $\tilde y$ | $\tilde y$ | $\tilde y$ | **涨市收益恒等于权利金，与涨多少无关**；跌市全额承受 |
| **ITM** $c<0$ | $r+\tilde y$（$r<c<0$） | $c+\tilde y$ | $c+\tilde y$ = strike 分量 + 权利金终值 | $\tilde y$ | 预收内在价值帮助支付同一区域的保护；被行权状态收益不能称为建仓时点的时间价值 |

**ITM 的关键分解。** 建仓时，对美式 call（或即时行权下界适用时），按 spot 归一的 extrinsic value 为
$$x_0\equiv y-(-c)=y+c\ge0.$$
对具有连续股息率的欧式 call，更精确的无套利下界是
$$y\ge\max\!\left(e^{-q\tau}-k e^{-r_f\tau},0\right),$$
在利率或股息非零时不必等于即期内在价值。到期时权利金现金已增长到 $\tilde y$，因此被行权状态上限是 $c+\tilde y$（含股息则为 $c+d_T+\tilde y$），**不是** $x_0$。又因非负股价意味着 $r\ge-1$，满仓 ITM 备兑收益区间是有限的 $[-1+d_T+\tilde y,\ c+d_T+\tilde y]$。经济含义是预付式下行保护，而非免费的“收益增强”。

### 2.2 部分覆盖 $f<1$：在裸股与满仓覆盖之间做线性插值

$$R_{cc}(f,c)=(1-f)\,r+f\cdot R_{cc}(1,c)$$

结构性差别只有一条，但极重要：

> **$f<1$ 时收益没有上限。** $r>c$ 之后斜率是 $(1-f)>0$ 而不是 0。这是 B 类（部分 ATM）\"大涨通吃\"的全部来源。

| strike | $r\le c$ | $r>c$ | 上限 | 备注 |
|---|---|---|---|---|
| OTM $c>0$, $f<1$ | $r+f\tilde y$ | $(1-f)r+fc+f\tilde y$ | 无 | 折线：斜率 $1\to(1-f)$，折点 $r=c$ |
| ATM $c=0$, $f<1$ | $r+f\tilde y$ | $(1-f)r+f\tilde y$ | 无 | 折点在 0 处，跌市完全线性 |
| ITM $c<0$, $f<1$ | $r+f\tilde y$ | $(1-f)r+fc+f\tilde y$ | 无 | 折点在 $r=c<0$，跌市也会被\"部分封住\"（因为 ITM 部分下行已卖掉） |

### 2.3 多档 strike（阶梯 / laddering）

一般化毫无难度：卖 $J$ 档，$f_j$ 覆盖比例、$c_j$ cap，$\sum_j f_j\le1$，

$$R_{cc}=r+d_T+\sum_{j=1}^{J}f_j\Big[\,y(c_j)\,e^{r_f\tau}-(r-c_j)^+\,\Big]\tag{2}$$

$R_{cc}(r)$ 是 $r$ 的**分段线性、凹、单调不减函数**，初始斜率为 1，以非负幅度 $f_j$ 逐级下降，最终斜率为 $1-\sum f_j\ge0$。反过来，一个有限分段线性 payoff 只有在以下条件成立时，才能在相差一个现金/股息常数的意义下写成 (2)：连续且凹、初始斜率恰为 1、最终斜率属于 $[0,1]$、各 strike 处斜率下降量非负。仅有“单调不减且斜率不超过 1”并不足以保证这种表示。

## 3. 全部分界点

### 3.1 相对标的（buy & hold）

由 (1a)，$R_{cc}-R_{stock}=f\big[\tilde y-(r-c)^+\big]$：

| 分界点 | 公式 | 说明 |
|---|---|---|
| **开始被行权** | $r=c$ | 之后每多涨 1 个点，让渡 $f$ 个点 |
| **相对标的转负** | $\;r^{*}=c+\tilde y\;$ | **与 $f$ 无关**！$f$ 只决定输多少（$-f(r-c-\tilde y)$），不决定何时开始输 |
| **绝对盈亏平衡** | 见下方分段条件 | 取决于 $r\le c$ 或 $r>c$ |
| **满仓上限** | $c+\tilde y$（仅 $f=1$） | $f<1$ 无上限 |

数值（$\sigma_{IV}=45\%,\ \tau=1M,\ r_f=4\%,\ c=5\%\Rightarrow y=3.2945\%,\ \tilde y=3.3056\%$，$f=1$）：cap $=8.3056\%$，$r^*=8.3056\%$，下行缓冲 $3.3056\%$。

绝对盈亏平衡必须分段求解。若 $r\le c$，则 $r_0=-(d_T+f\tilde y)$，且该解必须满足 $-1\le r_0\le c$。若 $r>c$ 且 $f<1$，则
$$r_0=-\frac{fc+d_T+f\tilde y}{1-f},\qquad r_0>c.$$
若 $f=1$，被行权分支恒为 $c+d_T+\tilde y$；除非该常数恰为零，否则没有孤立的盈亏平衡点。

### 3.2 相对现金 / 相对 put

- 现金的简单回报为 $h_f=e^{r_f\tau}-1$。备兑优于现金的条件必须分段：
  - 若 $r\le c$：$r>h_f-d_T-f\tilde y$；
  - 若 $r>c$ 且 $f<1$：$r>(h_f-fc-d_T-f\tilde y)/(1-f)$；
  - 若 $r>c$ 且 $f=1$：$c+d_T+\tilde y>h_f$，与 $r$ 超过 $c$ 多远无关。
- 由 §1.3，$f=1$ 备兑 vs 直接卖 put(K)：到期 payoff 完全相同，差别只在**融资成本、股息归属、提前行权风险、交易成本**，不在收益结构。

### 3.3 两个结构互相比较（A vs B 的一般形式）

设 A $=(f_A,c_A)$、B $=(f_B,c_B)$，$c_A>c_B$、$0\le f_B<f_A\le1$，且**权利金匹配** $f_Ay(c_A)=f_By(c_B)$（desk 定的口径）。权利金项相消：

$$D(r)\equiv R_A-R_B=f_B\,(r-c_B)^+-f_A\,(r-c_A)^+\tag{3}$$

即 **一个零成本比例价差（ratio call spread）：多 $f_B$ 张 $c_B$、空 $f_A$ 张 $c_A$**。分段：

| 区间 | $D$ | 斜率 |
|---|---|---|
| $r\le c_B$ | 0 | 0（**精确打平**） |
| $c_B<r\le c_A$ | $f_B(r-c_B)$ | $+f_B$ |
| $r>c_A$ | $f_B(r-c_B)-f_A(r-c_A)$ | $-(f_A-f_B)$ |

在 $0\le f_B<f_A\le1$ 下，
$$\text{A 的最大优势}=f_B\,(c_A-c_B)\ \ \text{（在 }r=c_A\text{ 处）},\qquad
\boxed{\;r^{**}=\frac{f_Ac_A-f_Bc_B}{f_A-f_B}\;}\tag{4}$$

代入 $f_A=1,c_B=0$ 即得旧笔记的 $r^{**}=c/(1-f_B)$。**（脚本校验：$r^{**}=13.06\%$ 两式一致；$D(c_A)=f_Bc_A=3.09\%$；$D(r^{**})=0$）**

$f_A>f_B$ 时 (3) 净空 call → **A 的优势有顶、B 的优势无顶**，右尾越肥 B 越占便宜。

## 4. 期望收益与 alpha：唯一严格的分解

### 4.1 精确恒等式

对欧式 call，或不会提前行权且持有到期的 call，对 (1) 取 $\mathbb{P}$ 期望，并用**权利金 = 风险中性折现的到期 payoff 期望**：

$$y\,e^{r_f\tau}=\mathbb{E}^{\mathbb{Q}}\big[(R-k)^+\big]$$

于是相对标的的超额收益（$f$ 覆盖比例、单期）：

$$\boxed{\;\alpha\;\equiv\;\mathbb{E}^{\mathbb{P}}[R_{cc}]-\mathbb{E}^{\mathbb{P}}[R_{stock}]\;=\;f\Big(\mathbb{E}^{\mathbb{Q}}\big[(R-k)^+\big]-\mathbb{E}^{\mathbb{P}}\big[(R-k)^+\big]\Big)\;}\tag{5}$$

**在上述欧式/持有到期设定内，这是 covered call 全部算术 alpha 的来源：卖出 call 的风险中性到期赔付期望减真实到期赔付期望。** 美式提前行权或中途平仓/换仓时，必须改用实际停止时点/盯市现金流，不能直接套该到期恒等式。$\mathbb{E}^{\mathbb{Q}}=\mathbb{E}^{\mathbb{P}}$ 时 $\alpha=0$。**（脚本校验：恒等式两边 = 0.196250%，MC = 0.196571%，MC se = 0.003%）**

### 4.2 改写成可估计的形式：richness ratio $\rho$

定义某个 strike 的**贵贱比**

$$\rho(c)\;\equiv\;\frac{\mathbb{E}^{\mathbb{P}}\big[(R-k)^+\big]}{\mathbb{E}^{\mathbb{Q}}\big[(R-k)^+\big]}\;=\;\frac{\text{真实平均赔付}}{\text{收到的权利金(终值)}}$$

则在相同的欧式/无提前行权且持有到期条件下，(5) 变成

$$\boxed{\;\alpha=f\,y\,e^{r_f\tau}\big(1-\rho(c)\big)=\underbrace{Y\,e^{r_f\tau}}_{\text{收到的权利金}}\times\big(1-\rho(c)\big)\;}\tag{6}$$

三点意义：

1. **$\rho<1$ 才有 alpha**，且 alpha 与权利金规模成正比。$\rho$ 是唯一需要估计的量，而且**可以直接从你现有面板估**：$\hat\rho(c)=\dfrac{\overline{\max(r-c,\,0)}}{\overline{\texttt{Call Yield}\cdot e^{r_f\tau}}}$，按 cap 分桶。
2. **权利金匹配的两两对比，本质上是纯粹的 $\rho$ 比较**（免分布假设、免模型）：由 (3) 取期望，$\mathbb{E}[D]=f_B\mathbb{E}^\mathbb{P}_B-f_A\mathbb{E}^\mathbb{P}_A$，配合 $f_A\mathbb{E}^\mathbb{Q}_A=f_B\mathbb{E}^\mathbb{Q}_B$：

$$\boxed{\;A\succ B\iff \rho(c_A)<\rho(c_B)\;}\tag{7}$$

   即在该到期框架内，**选择 payout-to-premium 比率更低的 strike**。delta、波动率和上涨概率不是独立的充分排序规则，而是通过各 strike 的 $\rho$ 进入排序。**（脚本在 5 种不同真实分布下逐一验证 (7) 的方向与 $\mathbb{E}[D]$ 符号完全一致，全 PASS）**
3. 这就是旧笔记\"$\mathbb{E}[D]\approx0$、所有 edge 来自真实分布 ≠ 隐含分布\"的定量版本。

### 4.3 一阶分解：VRP 收成 减 ERP 让渡

在**对数正态 toy 模型**中，这里只用漂移（$r_f-q$ vs $\mu-q$）和波动（$\sigma_{IV}$ vs $\sigma_{RV}$）参数化 $\mathbb{Q}$ 与 $\mathbb{P}$。设 $G(\sigma,m)=\mathbb{E}[(R-k)^+]$，则 (5) 写成 $\alpha/f=G(\sigma_{IV},r_f-q)-G(\sigma_{RV},\mu-q)$；在共同点 $(\bar\sigma,\bar m)$ 附近一阶展开：

$$\boxed{\;\frac{\alpha}{f}\;\approx\;\underbrace{e^{\bar m\tau}\phi(\bar d_1)\sqrt{\tau}\,(\sigma_{IV}-\sigma_{RV})}_{\text{VRP 项}}\;-\;\underbrace{\tau e^{\bar m\tau}N(\bar d_1)(\mu-r_f)}_{\text{ERP 项}}\;}\tag{8}$$

因此期望 payoff 的敏感度为 $\mathcal V_G=e^{\bar m\tau}\phi(\bar d_1)\sqrt{\tau}$ 与 $\Delta_G=e^{\bar m\tau}N(\bar d_1)$；省略 $e^{\bar m\tau}$ 只是在漂移接近零时的近似。**（脚本校验：VRP 项 +0.551%、ERP 项 −0.348%、合 +0.203%，精确值 +0.196%，相对误差 3.2%）**

**推论 A — 期限：短端更划算。** 年化后 VRP 项 $\propto\phi(d_1)(\sigma_{IV}-\sigma_{RV})/\sqrt{\tau}$（随 $\tau$ 变小而上升），ERP 项 $\propto\Delta(\mu-r_f)$（与 $\tau$ 基本无关）。数值：同一 IV 下 1M ATM 权利金 5.34%，年化滚动 12 次名义收 64.1%；12M 一次只收 19.5%（$\approx\sqrt{12}$ 倍关系）。**但**交易成本同样按 $1/\tau$ 放大，且短端 gamma 更毒（§6）—— 净效应要实测。

**推论 B — 本一阶对数正态比较中的 strike。** 记逆 Mills 比 $\lambda(d_1)=\phi(d_1)/N(d_1)$（单调递减）。$\mathcal{V}_G/\Delta_G=\lambda(d_1)\sqrt\tau$。若按“让渡的期望 payoff delta $=\delta^*$”设预算（$f=\delta^*/\Delta_G$）：

$$\alpha\approx\delta^*\Big[\lambda(d_1)\sqrt{\tau}\,(\sigma_{IV}-\sigma_{RV})-\tau(\mu-r_f)\Big]$$

共同因子 $e^{\bar m\tau}$ 在该比率中抵消。**在局部对数正态展开内**，ERP 代价被这一定义的 delta 预算锁死，而 VRP 项随 OTM 加深上升；这不是免分布假设的全局最优结论。实测 $\mathcal{V}_G/\Delta_G$：

| $c$ | −5% | 0% | +3% | +5% | +10% | +20% |
|---|---|---|---|---|---|---|
| $d_1$ | +0.485 | +0.091 | −0.137 | −0.285 | −0.643 | −1.313 |
| $\lambda(d_1)$ | 0.517 | 0.741 | 0.887 | 0.988 | 1.247 | 1.781 |
| vega/delta | 0.149 | 0.214 | 0.256 | 0.285 | 0.360 | 0.514 |
| $y(c)$ | 8.14% | 5.34% | 4.03% | 3.30% | 1.92% | 0.55% |

**推论 C — 检验“A 结构性优于 B”这一断言。** 权利金匹配下（$c_A=5\%,f_A=1$ vs ATM $f_B=0.617$）：

| | 空 delta | 空 vega | vega/delta |
|---|---|---|---|
| A（满仓 5% OTM） | 0.388 | 0.1106 | 0.285 |
| B（61.7% ATM） | 0.331 | 0.0708 | 0.214 |

A 在这组校准中**同时**卖出更多 delta（1.17×）和更多 vega（1.56×），单位 delta 的 vega 高 1.33×。这解释了当前对数正态 toy 校准里 A 为什么赢，但“平坦 IV + 正 VRP”本身不是 A 必胜定理；一般的权利金匹配排序仍只能由式 (7) 的 $\rho$ 决定。反例：平坦 IV 45%、RV 40%、年化漂移 $\mu=50\%$ 时，同一 toy 设定给出年化 $A-B\approx-0.63\%$；高漂移把 OTM 的真实赔付抬高到足以让 B 胜出。

## 5. 设计问题：$(f,c)$ 平面上的最优化

目标函数用 (6)：$\alpha(f,c)=f\,y(c)\,e^{r_f\tau}\big(1-\rho(c)\big)$。三种预算约束给三种解：

| 约束 | 最优化问题 | 结论 |
|---|---|---|
| **权利金预算** $f\,y(c)=Y$ | $\alpha=Y e^{r_f\tau}(1-\rho(c))$ | **退化成一维**：只需选 $\rho(c)$ 最小的 strike，$f$ 由 $Y/y(c)$ 反解。**这就是 sweet spot 的严格定义。** |
| **delta 预算** $f\Delta(c)=\delta^*$ | $\max_c\ \dfrac{y(c)}{\Delta(c)}\big(1-\rho(c)\big)$ | 在基准局部对数正态校准中随 OTM 加深上升；一般结果取决于 $\rho(c)$ 与可行域 |
| **无约束（算术 alpha）** | $\alpha$ 对 $f$ 线性 | $\rho(c)<1$ 就 $f=1$；角点解，无内点 |
| **几何/效用（§7）** | $\max\ \mu_{cc}-\tfrac12\sigma_{cc}^2$ | 可能有内点解；视参数而定，也可能仍是边界解 |

> **\"sweet spot 是一个区间不是一个点\"** 在这里有了理论解释：iso-premium 曲线上目标函数只依赖 $\rho(c)$，而 $\rho(c)$ 在一段 strike 上很平（且样本估计有噪声）→ 平坦最优。这不是数据脏，是问题结构。

**iso-premium 切片实测**（目标权利金 3.295% = A 的权利金，$\sigma_{IV}$ 平坦 45%，$\sigma_{RV}$=40%，$\mu$=15%，1M）：

| $c$ | $f$ | 空 delta | 空 vega | 年化 alpha | 年化波动 | 年化几何超额 |
|---|---|---|---|---|---|---|
| 0%（B） | 0.617 | 0.331 | 0.0708 | +0.50% | 26.92% | +4.80% |
| +2% | 0.743 | 0.353 | 0.0854 | +1.17% | 26.52% | +5.55% |
| +5%（A） | 1.000 | 0.388 | 0.1106 | +2.36% | 26.46% | +6.72% |
| +8% | 1.375 | — | — | 不可行（$f>1$，权利金目标够不到） | | |

**本组校准的结论：**在 IV 45%、RV 40%、$\mu=15\%$ 的平坦波动率 toy 中，最优解是“把 strike 推到 $f=1$ 刚好用满”。这只是数值结论，不是平坦波动率下的结构定理；足够高的漂移无需 skew 或非对数正态尾部就能反转 A/B。

### 5.1 可反转基准 A 优势的机制

**（a）Call skew —— 主因，且门槛很低。** 令 $\sigma_{IV}(c)=\sigma_{ATM}-s\cdot c$：

| skew 斜率 $s$ | 每 5% OTM 低几个 vol | $\alpha_{\text{ATM}}$ | $\alpha_{c=5\%}$ | 谁赢 |
|---|---|---|---|---|
| 0.0 | 0.0 | +0.50% | +2.35% | A |
| 0.2 | 1.0 | +0.50% | +1.03% | A |
| 0.4 | 2.0 | +0.50% | −0.30% | **B** |
| 0.6 | 3.0 | +0.50% | −1.62% | **B** |

> **只要 call wing 的 IV 比 ATM 低约 2 个 vol（每 5% OTM），A 的优势就被抹掉。** 这正是股票期权曲面的典型形状。**Skew 是 A/B 之争的一阶驱动因素。**

**（b）右尾肥厚 —— 影响水平，不易翻转排序。** 用\"对数正态 + 财报跳空\"混合分布（IV 保持平坦 45%）：

| 真实分布 | 年化波动 | 偏度 | 峰度 | $\alpha_{\text{ATM}}$ | $\alpha_{c=5\%}$ | 谁赢 |
|---|---|---|---|---|---|---|
| 对数正态 | 40.6% | +0.35 | 3.21 | +0.51% | +2.37% | A |
| 5% 概率 +25% 跳空 | 37.8% | +0.92 | 5.10 | −0.49% | +2.03% | A |
| 8% 概率 +30% 跳空 | 38.4% | +1.69 | 7.16 | −2.56% | −0.88% | A（都亏，A 亏得少） |
| 12% 概率 ±18% 跳空（对称） | 37.5% | +0.29 | 5.80 | +4.95% | +9.35% | A |
| 20% 概率 +35% 跳空 | 51.1% | +1.56 | 3.92 | −25.8% | −37.7% | **B** |

> 三点：
> 1. 在这一个特定校准的混合分布里，对称跳空情形提高了卖方 alpha。对称超额峰度对卖 call 的 alpha 没有普遍确定的符号；结果取决于概率质量相对各 strike 如何重新分配，以及 IV 如何保持/校准。
> 2. 右尾变肥会**同时**压低两者的 alpha（把整条 $\rho(c)$ 抬起来），只有极端右尾（20% 月份 +35% 跳空，年化波动飙到 51%）才翻转排序。
> 3. 所以\"NVDA 财报 gap 肥 → 选 B\"这个直觉**方向对但量级不够**；真正让 B 赢的是 **skew**，或者尾部肥到 $\rho(c_A)>\rho(c_B)$。**Phase 4/5 要分开检验这两件事，别混为一谈。**

**统一诊断（脚本 §7）**：五种设定下式 (7) 的方向与实际 $\mathbb{E}[D]$ 符号完全一致 ——

| 真实分布 / 曲面 | $\rho(5\%)$ | $\rho(\text{ATM})$ | (7) 预测 | 实际 $\mathbb{E}[D]\times12$ |
|---|---|---|---|---|
| 对数正态 40% | 0.9394 | 0.9867 | A | +1.88% ✓ |
| 5% × +25% 跳空 | 0.9491 | 1.0124 | A | +2.51% ✓ |
| 8% × +30% 跳空 | 1.0234 | 1.0660 | A | +1.69% ✓ |
| 20% × +35% 跳空 | 1.9575 | 1.6556 | **B** | −11.98% ✓ |
| 对数正态 + 3vol call skew | 1.0458 | 0.9875 | **B** | −2.08% ✓ |

> $\rho$ 是一个**标量诊断量**，把\"skew 有多陡\"\"右尾有多肥\"\"VRP 有多厚\"全部压缩进一个数。**Phase 4 只需要估 $\hat\rho(c)$ 这一条曲线。**

## 6. 希腊字母与 AQR 三重分解的对应

组合层面（单位名义），记剩余期限 $u=T-t$、连续股息率为 $q$：

$$\Delta_{cc}=1-f\,e^{-qu}N(d_1),\qquad \Gamma_{cc}=-f\,\Gamma_{c}<0,\qquad \mathcal{V}_{cc}=-f\,\mathcal{V}_{c}<0,\qquad \Theta_{cc}=-f\,\Theta_c$$

其中 $\Gamma_c=e^{-qu}\phi(d_1)/(S\sigma\sqrt u)$，$\mathcal V_c/S=e^{-qu}\phi(d_1)\sqrt u$。只有当多头 call 的 theta 为负时，期权腿 theta 才为正；利率/股息非零时其符号并非普遍固定。

$f=1,c=5\%$：$\Delta=0.612$、$\Gamma=-2.95$、$\mathcal{V}=-0.111$。

**有效股票暴露随价格自动变化**，这是关键：

$$\beta_\Delta(S)=1-f\,e^{-qu}N\!\big(d_1(K/S)\big),\qquad \frac{\partial\beta_\Delta}{\partial S}=-f\,\Gamma_c<0$$

| $S/S_0$ | 0.85 | 0.95 | 1.00 | 1.05 | 1.15 |
|---|---|---|---|---|---|
| $\beta_\Delta$ | 0.938 | 0.752 | 0.612 | 0.464 | 0.214 |

> 涨了自动减仓、跌了自动加仓 = **机械化的\"卖涨买跌\"（short momentum / long reversal）**。这就是 Israelov–Nielsen 里那条\"占 ~25% 风险、几乎零补偿\"的 equity-timing 腿。它是 $\Gamma_{cc}<0$ 的必然结果，不是执行瑕疵。
>
> **对 A↔B 切换规则的警示**：切换是在这条本已未获补偿的择时暴露上再叠一层主动择时。规则若不能真正预测右尾，只是纯加噪声。

三重分解与本文的对应：$\;$① equity beta = (1c) 的 $(1-f)R+f\min(R,k)$ 的线性部分；② short vol = (8) 的 VRP 项；③ equity timing = $\Gamma_{cc}<0$ 引起的 $\beta_\Delta(S)$ 漂移。它不是持有到期算术恒等式 (5)/(8) 中的独立加总项，但会影响 payoff 分布与多期结果。

## 7. 多期复合与路径依赖

### 7.1 相对 strike 滚动的复合

每期按当期现价重设 $K_t=(1+c)S_{t}$、覆盖比例 $f$ 固定，则每期收益只是当期 $r_t$ 的函数 $g(r_t)$（由 (1b) 给出），指数

$$I_N=I_0\prod_{t=1}^{N}\big(1+g(r_t)\big),\qquad g(r)=(1-f)r+f\min(r,c)+f\tilde y_t$$

**顺序无关，但对 $\{r_t\}$ 的离散程度极度敏感**（因为 $g$ 凹）。同样的两期累计标的收益 +21%：

| 月度路径 | 标的累计 | 备兑累计 | 差 |
|---|---|---|---|
| (+10%, +10%) | +21.00% | +17.28% | −3.72% |
| (+21%, 0%) | +21.00% | +11.86% | −9.14% |
| (+33%, −9.0%) | +21.00% | +2.09% | −18.91% |
| (+50%, −19.3%) | +21.00% | −9.07% | −30.08% |

> 这清楚展示了**滚动重设如何把单期短 gamma 的凹性转化为多期路径依赖**：在所列例子中，标的终点相同而月度收益越离散，备兑越差。短 gamma 已经存在于每个单期 payoff；复合只是让它在序列层面的后果显形。

### 7.2 方差拖累：第二个（常被忽略的）优势来源

二阶展开应写成 $\mathbb{E}[\ln(1+x)]\approx\mu_x-\tfrac12\mathbb{E}[x^2]=\mu_x-\tfrac12(\sigma_x^2+\mu_x^2)$：

$$\underbrace{G_{cc}-G_{stock}}_{\text{几何超额}}\;\approx\;\underbrace{\alpha}_{\text{算术 alpha, (6)}}\;+\;\underbrace{\tfrac12\big(\sigma_{stock}^2-\sigma_{cc}^2\big)}_{\text{方差拖累节省}}\;+\;\underbrace{\tfrac12\big(\mu_{stock}^2-\mu_{cc}^2\big)}_{\text{均值平方修正}}\tag{9}$$

实测（$f=1,c=5\%,\sigma_{RV}=40\%,\mu=15\%$）：

| | 年化算术 | 年化波动 | $\mathbb{E}[\ln(1+x)]\times12$ |
|---|---|---|---|
| 标的 | +15.08% | 40.0% | **+6.98%** |
| 备兑（IV=45%） | +17.44% | 26.5% | **+13.71%** |

二阶近似为 alpha +2.36% + 方差拖累节省 +4.76% + 均值平方修正约 −0.03% = **+7.09%**；直接计算的几何超额为 **+6.72%**，剩余约 −0.37% 是高阶残差。

**VRP 敏感性（RV 固定 40%）：**

| $\sigma_{IV}$ | 年化 alpha | 拖累节省 | 几何超额 |
|---|---|---|---|
| 35% | −10.74% | +4.76% | −6.33% |
| 40%（零 VRP） | −4.25% | +4.76% | **+0.15%** |
| 45% | +2.36% | +4.76% | +6.72% |
| 50% | +9.05% | +4.76% | +13.35% |

**零 VRP（$\sigma_{IV}=\sigma_{RV}$）时几何超额到底是正是负？** 由 (9)，它近似等于方差拖累节省减 ERP 让渡，再加均值平方修正。拖累节省按 $\sigma^2$ 增长，ERP 让渡大致按 $\mu$ 线性增长；修正项与高阶项使其没有普遍固定符号。$f=1,c=5\%$，年化实测：

| $\sigma_{RV}$ \ $\mu$ | 5% | 10% | 15% | 25% |
|---|---|---|---|---|
| **25%** | +1.01% | −0.37% | −1.83% | −5.09% |
| **40%** | +3.71% | +1.99% | +0.19% | −3.72% |
| **60%** | +10.14% | +7.95% | +5.96% | +1.77% |

> **三点必须记住：**
> 1. 上一版\"零 VRP 时几何超额≈0\"只是 $\sigma=40\%,\mu=15\%$ 这一格恰好接近零的巧合，**不是通例**。真正的规律是：**波动越高、漂移越低，方差拖累节省越容易盖过 ERP 让渡**；波动低、漂移高时零 VRP 必输（−5.1%）。
> 2. **NVDA 恰好是\"高波动 + 高漂移\"**，落在这张表里胜负交界的对角线区域——这正是为什么 A/B/买入持有的排序在 NVDA 上必须靠实证，公式给不出确定号。**换到低波动名字（如 MSFT/AAPL）时，表格左上区间的\"零 VRP 也能赢\"这条结论会反过来**，这是 Mag7 横截面差异的一个理论来源。
> 3. 上表全在**对数正态**下算。真实右尾更肥 → $\mathbb{E}^\mathbb{P}[(R-k)^+]$ 更大 → alpha 和几何超额同时缩水（§5.1b 实测：8% 概率 +30% 跳空时 $\alpha_{c=5\%}$ 从 +2.37% 掉到 −0.88%）。**(9) 的高斯近似在重度截尾 + 强偏斜下不可靠，最终一定用样本 $\overline{\ln(1+g)}$ 算，不要用 $\mu-\sigma^2/2$。**

### 7.3 偏度与 Sharpe 失真

$f=1,c=5\%$：$\text{skew}(R_{cc})=-0.99$ vs $\text{skew}(R_{stock})=+0.35$。年化波动 26.5% vs 40.0%。

> 卖方策略把右尾切掉、左尾留着 → 偏度由正转负。Sharpe 只看前两阶矩，会**系统性高估**这类策略。主口径用 Calmar / Sortino / 逐月胜负 + 最大回撤，Sharpe 仅作参考（对上旧笔记 §5.3）。

### 7.4 期限结构：滚动 N 次短期 ≠ 一次长期

$y_{ATM}(\tau)\approx0.4\,\sigma\sqrt{\tau}$，所以年化滚动收取的权利金 $\approx\sqrt{N}\times$ 一次 $N$ 期权利金：

| 期限 | ATM 权利金 | 年化（按滚动次数） |
|---|---|---|
| 1M | 5.34% | 64.1% |
| 3M | 9.42% | 37.7% |
| 12M | 19.48% | 19.5% |

$\mathbb{Q}$ 下这多收的权利金被\"反复封顶\"精确抵消（无套利）。差别只在 $\mathbb{P}$：短端 VRP 更厚（推论 A）但 gamma 成本、交易成本、路径依赖也更重。

## 8. 指数化实现（逐日 mark-to-market）

建仓日 $t_0$：$n=I_{t_0}/S_{t_0}$ 股，空 $f\,n$ 张 call，现金 $=f\,n\,C_{t_0}$。任意 $t\in(t_0,T]$：

$$\frac{I_t}{I_{t_0}}=\frac{S_t}{S_{t_0}}-f\cdot\frac{C_t-C_{t_0}e^{r_f(t-t_0)}}{S_{t_0}}+\frac{D_{t_0\to t}}{S_{t_0}}\tag{10}$$

其中 $C_t$ 是**期权当日市价**（未到期时含时间价值）。到期 $C_T=(S_T-K)^+$ 时 (10) 精确退回 (1)。**（脚本校验：$f=1$ 与 $f=0.4$ 两档，$|(10)@T-(1)|_{\max}=1.1\text{e-}16$）**

三个实现注意点：

1. **逐日路径 ≠ 到期路径**。(10) 说明日频指数会先反映时间价值的衰减/膨胀。在月中标的暴涨、月末回落的情形下，指数日内会先跌（期权 MTM 亏）再补回来 —— 回撤统计会比按月计算的更难看。做回撤/波动统计时要说明用的是哪个频率。
2. **建仓时 equity 价值 = base 是对的**（备兑 = 满仓持标的 + 在其中一部分上卖 call），权利金进现金账户。对上旧笔记 §9。
3. **`Cap`/`Call Yield` 是\"那张期权\"的属性，不是组合属性**。跨 Exposure 档相同、跨 Income 档不同。区分不同 $f$ 只能看 `Index Return`。

## 9. 现实摩擦（把 (5) 从\"存在 alpha\"降到\"净 alpha\"）

$$\alpha_{\text{net}}=\underbrace{f\,y\,e^{r_f\tau}(1-\rho)}_{(6)}-\underbrace{\frac{f\cdot\text{spread}/2}{\tau}\Big|_{\text{年化}}}_{\text{买卖价差}}-\text{行权/交割成本}-\text{税}-\text{挂牌离散损失}$$

| 摩擦 | 机制 | 量级/处理 |
|---|---|---|
| **买卖价差** | 每次滚动付半点价差，年化按 $1/\tau$ 放大 | 月度滚动 12 次；单腿宽 0.5% of premium 就吃掉可观比例。这**直接对冲掉推论 A（短端更好）** |
| **挂牌 strike 离散** | 只能取挂牌整数档 → 实际 $c$ 抖动（旧笔记：strike% 在 94–109% 抖） | 使 target-yield 反解不精确；理论 $c^*$ 落在两档之间时用插值或就近取 |
| **美式提前行权** | call 的提前行权是最优停止问题，通常集中在除息日前 | 应使用实际离散股息、$K$ 的融资收益、借券约束和剩余可选性，比较立即行权价值 $S-K$ 与继续持有价值。“股息大于剩余时间价值”只是一条经验规则，不是一般判据。NVDA 股息很小使欧式近似较合理，但仍应按具体合约与日期核验 |
| **target-yield 的内生性陷阱** | 低波期为达标必须贴近 ATM（$c$ 紧）、高波期可远（$c$ 松） → $c$ 与 IV 正相关 | 由期权价格关系可局部推出：固定 $Y$ 通常使 $c$ 随 $\sigma$ 同向动。**低波牛市可能因 cap 收紧且股价上涨而不利；严重程度取决于实际收益路径。fixed-delta 选 strike 可削弱这条 target-yield 渠道** |
| **税** | 权利金和被行权的资本利得多为短期 | 税后口径会显著改变 A/B 排序（A 更常被行权） |
| **现金拖累** | 权利金放在短端，$r_f$ 高时是收益、低时是拖累 | 已在 (1) 的 $e^{r_f\tau}$ 里 |
| **拥挤度** | 卖方 AUM 上升压缩 VRP → $\rho\uparrow$ | 慢变量，用于判断\"策略整体还值不值得做\"（旧笔记 §4 NVDY） |

## 10. 附录：对数正态封闭解（全部经 MC 校验）

设 $R=\exp\big((m-\tfrac12\sigma^2)\tau+\sigma\sqrt{\tau}Z\big)$，$Z\sim N(0,1)$，$m$ = 该测度下 $R$ 的总漂移（$\mathbb{Q}$: $m=r_f-q$，$\mathbb{P}$: $m=\mu-q$）；

$$d_1=\frac{-\ln k+(m+\tfrac12\sigma^2)\tau}{\sigma\sqrt{\tau}},\qquad d_2=d_1-\sigma\sqrt{\tau}$$

| 量 | 封闭解 | MC 校验 |
|---|---|---|
| $\mathbb{E}[(R-k)^+]$ | $e^{m\tau}N(d_1)-k\,N(d_2)$ | 0.031093 / 0.031090 ✓ |
| 权利金 $y$ | $e^{-q\tau}N(d_1^{\mathbb{Q}})-k\,e^{-r_f\tau}N(d_2^{\mathbb{Q}})$（BS，用 $\sigma_{IV}$） | — |
| 被行权概率 $\mathbb{P}(R>k)$ | $N(d_2)$ | 0.354940 / 0.354758 ✓ |
| $\mathbb{E}[R\,\mathbf{1}_{R\le k}]$ | $e^{m\tau}N(-d_1)$ | 0.608798 / 0.608979 ✓ |
| $\mathbb{E}[R^2\mathbf{1}_{R\le k}]$ | $e^{(2m+\sigma^2)\tau}N(-d_2-2\sigma\sqrt{\tau})$ | 0.577826 / 0.578009 ✓ |
| $\mathbb{E}[\min(R,k)]$ | $e^{m\tau}-\mathbb{E}[(R-k)^+]$ | 0.981485 / 0.981476 ✓ |
| $\mathbb{E}[\min(R,k)^2]$ | $e^{(2m+\sigma^2)\tau}N(-d_2-2\sigma\sqrt{\tau})+k^2N(d_2)$ | 0.969148 / 0.969130 ✓ |
| $\mathbb{E}[R\min(R,k)]$ | $e^{(2m+\sigma^2)\tau}N(-d_2-2\sigma\sqrt{\tau})+k\,e^{m\tau}N(d_1)$ | ✓ |

**组合方差**（由 (1c)，常数项不影响方差）：

$$\mathrm{Var}(R_{cc})=(1-f)^2\mathrm{Var}(R)+f^2\mathrm{Var}\big(\min(R,k)\big)+2f(1-f)\mathrm{Cov}\big(R,\min(R,k)\big)$$

**（校验：$f=1$ 解析 0.005834 / MC 0.005836；$f=0.5$ 解析 0.008881 / MC 0.008884）**

由此可解析地画出 $(f,c)$ 平面上的 **均值—方差前沿**，不必回测就能定位可行域，再用历史 $\hat\rho(c)$ 替换模型 $\rho(c)$ 得到实证前沿。

## 11. 一页总结：这套理论说了什么

1. **单期收益只有一条公式**：$R_{cc}=(1-f)r+f\min(r,c)+f\tilde y+d_T$。OTM/ATM/ITM × 满仓/部分六种情形全是它的特例（§2），满足表示条件的多档阶梯也是（§2.3）。定价用年化 $q$，实际 payoff 用 $d_T$。
2. **备兑写权 = equity beta + 现金担保卖 put**（§1.3）。它不是独立风险来源，$(f,c)$ 只是\"卖多大、卖多远的 put\"。
3. **相对标的的转负点 $r^*=c+\tilde y$ 与 $f$ 无关**；$f$ 只决定输赢的斜率（§3.1）。
4. **对持有到期的欧式/无提前行权 call，算术 alpha $=Y e^{r_f\tau}(1-\rho(c))$**，$\rho(c)=$ 真实平均到期赔付/权利金（§4.2）。在该框架内，关键待估量是 $\rho$，可直接从面板按 cap 分桶估计。
5. **权利金匹配的对比 = 纯粹的 $\rho$ 比较**：$A\succ B\iff\rho(c_A)<\rho(c_B)$（式 7，免分布假设）。
6. **在持有到期框架内，A/B 始终由 $\rho$ 排序。** A 在基准平坦 IV 对数正态校准中胜出，但“平坦 IV + 正 VRP”不充分：IV 45%、RV 40%、$\mu=50\%$ 时 toy 给出年化 $A-B\approx-0.63\%$。skew、右尾形状和高漂移都可能让 B 胜出。
7. **Sweet spot 在 iso-premium 曲线上退化成一维问题**（选 $\min\rho(c)$），且因 $\rho$ 平坦 + 估计噪声，天然是**区间不是点**（§5）。
8. **复合层面存在潜在几何收益**：方差拖累节省，以及式 (9) 的均值平方修正（§7.2）。零 VRP 时它能否盖过 ERP 让渡取决于波动/漂移比——高波动低漂移时可能胜出，高漂移低波动时倾向于落败；NVDA 高波高漂移处于争议区，只能实证。
9. **$\Gamma_{cc}<0$ 强制\"涨了减仓、跌了加仓\"**（§6），这是 AQR 那条未获补偿的择时腿。A↔B 切换规则是在它上面再叠一层择时，举证责任在规则一边。
10. **短端 VRP 更厚但摩擦也按 $1/\tau$ 放大**（§4.3 推论 A + §9），净效应只能实测。
